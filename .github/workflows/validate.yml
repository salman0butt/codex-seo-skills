name: Validate Codex skills
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Codex skill frontmatter
        run: python scripts/portability_check.py --strict
      - name: Verify isolated Codex installation
        run: python -m unittest discover -s tests -p test_codex_installer.py -v
      - name: Verify source maps include every file
        run: python scripts/generate_skill_map.py --check
      - name: Validate mapping graph, ownership and agent mirrors
        run: python -m unittest discover -s tests -p test_skill_map.py -v
      - name: Verify runtime failure handling and offline execution
        run: python -m unittest discover -s tests -p test_codex_runtime_contract.py -v
      - name: Verify portable plugin manifest
        run: python -m unittest discover -s tests -p test_codex_manifest.py -v
      - name: Verify persisted runtime Python selection
        run: python -m unittest discover -s tests -p test_codex_launcher.py -v
      - name: Verify bounded public-page audit contracts
        run: python -m unittest discover -s tests -p test_quick_audit.py -v
      - name: Verify offline SEO provider safety and configuration semantics
        run: python -m unittest discover -s tests -p test_integration_doctor.py -v
      - name: Verify Indexing API publish restrictions
        run: python -m unittest discover -s tests -p test_indexing_publish_guard.py -v
      - name: Verify bounded Google API connectivity contracts (mocked)
        run: python -m unittest discover -s tests -p test_live_integration_verify.py -v
      - name: Verify private aggregate report authorization and safe response semantics
        run: python -m unittest discover -s tests -p test_private_seo_report.py -v
      - name: Verify historical comparisons, provenance and offline implementation handoff
        run: python -m unittest discover -s tests -p test_seo_report_builder.py -v
      - name: Verify offline SQLite history, concurrency and privacy
        run: python -W error::ResourceWarning -m unittest discover -s tests -p test_seo_history.py -v
      - name: Verify scheduler templates cannot silently install or access networks
        run: python -m unittest discover -s tests -p test_seo_schedule_template.py -v
      - name: Verify stable v1 source, security and capability matrix
        run: python -m unittest discover -s tests -p test_v1_readiness.py -v
      - name: Verify stale evidence suppression and advisory alert policies
        run: python -W error::ResourceWarning -m unittest discover -s tests -p test_seo_evidence_alerts.py -v
  upstream-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded unit-test prerequisites
        run: python -m pip install --disable-pip-version-check pytest requests beautifulsoup4 lxml lxml-html-clean
      - name: Run independent upstream runtime and SEO security contracts
        run: |
          python -m pytest -q \
            tests/test_runtime.py \
            tests/test_url_safety.py \
            tests/test_metadata_template.py \
            tests/test_schema_v2.py \
            tests/test_sitemap_discovery.py \
            tests/test_gsc_query.py \
            tests/test_url_safety.py \
            tests/test_capture_screenshot_paths.py \
            tests/test_fetch_page_size_cap.py \
            tests/test_redirect_body_cap.py \
            tests/test_google_oauth_flow.py \
            tests/test_render_page.py \
            tests/test_hostile_inputs.py
  managed-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install managed runtime and Chromium in isolated CI data directory
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/codex-seo-smoke
        run: |
          ./scripts/codex-seo setup
          ./scripts/codex-seo doctor --json > "$RUNNER_TEMP/codex-seo-doctor.json"
          python -c 'import json,os,pathlib; status=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"codex-seo-doctor.json").read_text()); assert status["ready"], status; assert status["browser_ready"], status'
          ./scripts/codex-seo run metadata_template.py --title "Example Studio | Pricing" --description "Example Studio | Pricing. Get started now!" --json > "$RUNNER_TEMP/metadata-audit.json"
          ./scripts/codex-seo run schema_generate.py profile --name "Example Studio" --url https://example.com/about > "$RUNNER_TEMP/schema-profile.json"
          python -c 'import json,os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"]); assert json.loads((root/"metadata-audit.json").read_text())["pages_checked"]==1; assert json.loads((root/"schema-profile.json").read_text())["@context"]=="https://schema.org"'
          PLAYWRIGHT_BROWSERS_PATH="$XDG_DATA_HOME/codex-seo-runtime/ms-playwright" "$XDG_DATA_HOME/codex-seo-runtime/.venv/bin/python" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.set_content("<title>Codex SEO smoke</title><h1>Smoke</h1>"); assert page.title()=="Codex SEO smoke"; b.close(); p.stop()'
          ./scripts/codex-seo run render_page.py https://example.com/ --mode always --viewport mobile --timeout-ms 20000 --json --max-text 10000 > "$RUNNER_TEMP/live-render.json"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"live-render.json").read_text()); assert r["error"] is None, r["error"]; assert r["status_code"]==200, r["status_code"]; assert "Example Domain" in (r.get("content") or r.get("raw_content") or ""), r.keys()'
          if ./scripts/codex-seo run private_seo_report.py gsc > "$RUNNER_TEMP/aggregate-blocked.json"; then
            echo "Private aggregate report succeeded without account-read opt-in" >&2
            exit 1
          else
            test "$?" -eq 2
          fi
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"aggregate-blocked.json").read_text()); assert r["network_requests"]==0 and not r["live_verified"] and r["metrics"]=={}'
          if ./scripts/codex-seo run live_integration_verify.py pagespeed --url https://example.com/ > "$RUNNER_TEMP/live-blocked.json"; then
            echo "Live verifier unexpectedly succeeded without --live" >&2
            exit 1
          else
            test "$?" -eq 2
          fi
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"live-blocked.json").read_text()); assert r["network_requests"]==0; assert not r["live_verified"]'
          ./scripts/codex-seo run seo_history.py record \
            --history-dir "$RUNNER_TEMP/offline-seo-history" \
            --gsc-current examples/synthetic/gsc-current.json \
            --quick-audit examples/synthetic/quick-audit.json \
            --export-markdown > "$RUNNER_TEMP/history-first.json"
          ./scripts/codex-seo run seo_history.py record \
            --history-dir "$RUNNER_TEMP/offline-seo-history" \
            --gsc-current examples/synthetic/gsc-current.json \
            --quick-audit examples/synthetic/quick-audit.json \
            --export-markdown > "$RUNNER_TEMP/history-replay.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); a=json.loads((p/"history-first.json").read_text()); b=json.loads((p/"history-replay.json").read_text()); assert a["status"]=="created"; assert b["status"]=="unchanged"; assert a["snapshot"]["id"]==b["snapshot"]["id"]==1; assert (p/"offline-seo-history/reports/snapshot-000001.md").is_file(); assert b["markdown_export"]=="already_exists"'
          ./scripts/codex-seo run seo_history.py record \
            --history-dir "$RUNNER_TEMP/evidence-alert-history" \
            --gsc-current examples/synthetic/gsc-previous.json > "$RUNNER_TEMP/alert-baseline.json"
          ./scripts/codex-seo run seo_history.py record \
            --history-dir "$RUNNER_TEMP/evidence-alert-history" \
            --gsc-current examples/synthetic/gsc-current-drop-example.json > "$RUNNER_TEMP/alert-current.json"
          ./scripts/codex-seo run seo_evidence_alerts.py \
            --history-dir "$RUNNER_TEMP/evidence-alert-history" --as-of 2026-10-23 > "$RUNNER_TEMP/alerts-suppressed.json"
          ./scripts/codex-seo run seo_evidence_alerts.py \
            --history-dir "$RUNNER_TEMP/evidence-alert-history" --as-of 2026-10-23 \
            --confirm-history-same-property > "$RUNNER_TEMP/alerts-attested.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); a=json.loads((p/"alerts-suppressed.json").read_text()); b=json.loads((p/"alerts-attested.json").read_text()); assert a["network_requests"]==0 and a["notifications_sent"]==0 and not a["alerts"]; assert any(x["reason"]=="same_property_not_attested" for x in a["suppressed_comparisons"]); assert len(b["alerts"])==1 and b["alerts"][0]["kind"]=="aggregate_count_drop"; assert b["alerts"][0]["relative_drop_percent"]==50.0'
          ./scripts/codex-seo run seo_report_builder.py \
            --gsc-current examples/synthetic/gsc-current.json \
            --gsc-previous examples/synthetic/gsc-previous.json \
            --ga4-current examples/synthetic/ga4-current.json \
            --ga4-previous examples/synthetic/ga4-previous.json \
            --quick-audit examples/synthetic/quick-audit.json \
            --confirm-same-property --format json > "$RUNNER_TEMP/seo-evidence.json"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"seo-evidence.json").read_text()); assert r["network_requests"]==0; assert len(r["handoff_tasks"])==2; assert r["provider_reports"]["gsc"]["comparison"]["status"]=="compared_with_operator_attestation"; assert r["provider_reports"]["ga4"]["current"]["metrics"]["organic_search_sessions"]==100; assert "SECRET" not in json.dumps(r)'
          ./scripts/codex-seo run integration_doctor.py --json > "$RUNNER_TEMP/integrations.json"
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"integrations.json").read_text()); assert d["network_requests"]==0; assert not any(x["live_verified"] for x in d["services"].values())'
          ./scripts/codex-seo run quick_audit.py https://example.com/ --json > "$RUNNER_TEMP/quick-audit.json"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"quick-audit.json").read_text()); assert r["http_status"]==200, r; assert r["observations"]["title"]=="Example Domain"; assert r["seo_score"] is None; assert r["scope"]=="single-page-raw-html"'
  macos-runtime-smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check macOS managed Python environment and public audit
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/codex-seo-macos
          PIP_TIMEOUT: '30'
          PIP_RETRIES: '3'
          PIP_RESUME_RETRIES: '3'
        run: |
          ./scripts/codex-seo setup --skip-browser
          ./scripts/codex-seo doctor --json > "$RUNNER_TEMP/doctor-macos.json"
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"doctor-macos.json").read_text()); assert d["ready"], d'
          # Public network fetches are exercised on Ubuntu; macOS verifies
          # real runtime dispatch and fail-closed URL safety without relying
          # on a third-party site responding successfully in every CI run.
          ./scripts/codex-seo run schema_generate.py profile --name "Example Studio" --url https://example.com/about > "$RUNNER_TEMP/schema-macos.json"
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"schema-macos.json").read_text()); assert d["@context"]=="https://schema.org"'
          if ./scripts/codex-seo run quick_audit.py 'http://127.0.0.1/?secret=redacted' --json > "$RUNNER_TEMP/blocked-macos.json"; then
            echo "Expected private-host audit to be blocked" >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 2
          fi
          python -c 'import json,os,pathlib; t=(pathlib.Path(os.environ["RUNNER_TEMP"])/"blocked-macos.json").read_text(); d=json.loads(t); assert d["outcome"]=="blocked",d; assert "secret=" not in t'
